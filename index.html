<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>紫卡词根</title>
<meta name="description" content="Warframe 紫卡名字里的每个前缀和后缀，以及它们来自哪个词。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 16 16 30 3 16Z' fill='%238b5cf6'/%3E%3Cpath d='M16 7 11 16l5 9 5-9Z' fill='%23f3e8ff'/%3E%3C/svg%3E">
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<header class="top">
  <div class="wrap">
    <p class="eyebrow">Warframe · Riven Mods</p>
    <h1>紫卡词根</h1>
    <p class="sample" aria-label="示例：Hema Croni-enido">Hema <span class="p">Croni</span>-<span class="p">eni</span><span class="s">do</span></p>
    <div class="tools">
      <label class="search">
        <span class="sr">搜索</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜属性、词根或来源词" autocomplete="off">
      </label>
      <p class="key"><span class="k-p">前缀</span><span class="k-s">后缀</span><span class="k-x">删去的字母</span><span class="k-a">补上的元音</span></p>
    </div>
  </div>
</header>

<main class="wrap">
  <section aria-labelledby="h-active">
    <h2 id="h-active" class="sect">在用<span class="n" id="n-active"></span></h2>
    <div class="grid" id="active"></div>
  </section>
  <section aria-labelledby="h-unused">
    <h2 id="h-unused" class="sect">未启用<span class="n" id="n-unused"></span></h2>
    <div class="grid muted" id="unused"></div>
  </section>
  <p class="empty" id="empty" hidden>没有找到，换个关键词试试。</p>
</main>

<footer class="wrap foot">
  <p>来源链接指向 Wiktionary、Warframe Wiki 等。词根取自游戏数据（2026-10）。DE 没有公开过词根的来历，以上都是考证结果；标「存疑」的只是可能。</p>
  <p><a href="https://github.com/wxhn1225/riven-etymology">GitHub</a></p>
</footer>

<script src="assets/js/app.js"></script>
</body>
</html>
