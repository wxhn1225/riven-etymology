<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>紫卡词根</title>
<meta name="description" content="Warframe 紫卡名字里的每个前缀和后缀，来自哪个词，为什么是这个词。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,700;1,500&family=Nunito:wght@900&family=Noto+Sans+SC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='14' height='20' rx='2' fill='%23c59bff' transform='rotate(-8 10 15)'/%3E%3Crect x='15' y='7' width='14' height='20' rx='2' fill='%2316c2d8' transform='rotate(6 22 17)'/%3E%3C/svg%3E">
</head>
<body>
<div id="overview">
  <header class="hero">
    <div class="confetti" aria-hidden="true"></div>
    <button type="button" class="lang-btn lang-switch" data-t="langBtn" data-t-aria="langAria" aria-label="Switch to English">EN</button>
    <div class="wrap">
      <h1 class="ransom" data-ransom="紫卡词根" data-t-ransom="title" aria-label="紫卡词根">紫卡词根</h1>
      <div class="sample" data-sample data-t-aria="sample" aria-label="例：Vectis Sati-critaata"></div>
      <div class="hero-actions">
        <button class="paper-btn" type="button" id="start" data-t="start">开始讲解</button>
        <label class="search">
          <span class="sr" data-t="search">搜索</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" data-t-ph="searchPh" placeholder="搜属性、词根或来源词" autocomplete="off">
        </label>
      </div>
    </div>
  </header>

  <nav class="wrap toc-wrap" data-t-aria="toc" aria-label="目录">
    <div class="toc" id="toc"></div>
  </nav>

  <main class="wrap">
    <section data-group="active">
      <h2 class="ransom small" data-ransom="在用的词根" data-t-ransom="groupActive">在用的词根</h2>
      <div class="grid"></div>
    </section>
    <section data-group="dedicated">
      <h2 class="ransom small" data-ransom="有专用词根但名字没用上" data-t-ransom="groupDedicated">有专用词根但名字没用上</h2>
      <div class="grid dedicated"></div>
    </section>
    <section data-group="other">
      <h2 class="ransom small" data-ransom="预留和已删除的" data-t-ransom="groupOther">预留和已删除的</h2>
      <div class="grid unused"></div>
    </section>
    <p class="empty" id="empty" data-t="empty" hidden>没有找到，换个关键词试试。</p>
  </main>

  <footer class="foot">
    <svg class="hills" viewBox="0 0 1440 220" preserveAspectRatio="none" aria-hidden="true"><use href="#hills-art"/></svg>
    <div class="foot-text"><p data-t="foot">DE 没有公开过这些词根的来历，这里是考证结果。盖着「存疑」章的只是可能。</p></div>
  </footer>
</div>

<div class="stage" id="stage" hidden role="region" data-t-aria="stage" aria-label="讲解">
  <div class="confetti" aria-hidden="true"></div>
  <svg class="hills stage-hills" viewBox="0 0 1440 220" preserveAspectRatio="none" aria-hidden="true"><use href="#hills-art"/></svg>
  <div class="stage-top">
    <span class="brand ransom tiny" data-ransom="紫卡词根" data-t-ransom="title" aria-hidden="true"></span>
    <span class="top-right">
      <span class="counter" id="counter"></span>
      <button type="button" class="menu-btn lang-switch" data-t="langBtn" data-t-aria="langAria" aria-label="Switch to English">EN</button>
      <button type="button" class="menu-btn" id="menuBtn" data-t="menu" aria-haspopup="dialog" aria-controls="tocPanel">目录</button>
    </span>
  </div>
  <div class="toc-panel" id="tocPanel" hidden role="dialog" data-t-aria="toc" aria-label="目录">
    <div class="toc-sheet" id="tocSheet"></div>
  </div>
  <div class="slide" id="slide" aria-live="polite"></div>
  <div class="stage-ui">
    <button type="button" class="nav prev" id="prev" data-t-aria="prev" aria-label="上一个">‹</button>
    <button type="button" class="nav next" id="next" data-t-aria="next" aria-label="下一个">›</button>
    <p class="hints" data-t="hints">← → 翻页　M 目录　Esc 回总览　F 全屏　H 隐藏按钮</p>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="hills-art">
      <path fill="#9fd7ff" d="M0 70 C 180 20 360 110 560 70 S 960 10 1160 60 S 1380 90 1440 60 V220 H0Z"/>
      <path fill="#7cc6ff" d="M0 110 C 220 70 420 150 640 110 S 1020 60 1220 105 S 1400 130 1440 110 V220 H0Z"/>
      <path fill="#ffd046" d="M0 150 C 200 120 430 185 660 150 S 1060 115 1260 150 S 1410 170 1440 155 V220 H0Z"/>
      <path fill="#ff9ec7" d="M0 188 C 240 165 470 210 700 188 S 1100 165 1300 190 S 1420 200 1440 192 V220 H0Z"/>
    </g>
  </defs>
</svg>

<script src="data/affixes.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
